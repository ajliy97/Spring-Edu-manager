<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de estudiante - SpringEduManager</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container">
    <h1 th:text="${estudiante.id} != null ? 'Editar estudiante' : 'Nuevo estudiante'"></h1>

    <div class="card">
        <form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}">
                <p class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" th:field="*{apellido}">
                <p class="error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}">
                <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label>Cursos</label>
                <div class="checkbox-list">
                    <label th:each="curso : ${cursos}">
                        <input type="checkbox" name="cursoIds" th:value="${curso.id}"
                               th:checked="${estudiante.cursos.contains(curso)}">
                        <span th:text="${curso.nombre}"></span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/estudiantes}" class="btn" style="background:#888;">Cancelar</a>
        </form>
    </div>
</div>

</body>
</html>
