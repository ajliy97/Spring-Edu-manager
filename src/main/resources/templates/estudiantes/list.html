<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Estudiantes - SpringEduManager</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container">
    <h1>Estudiantes</h1>

    <div th:replace="~{fragments :: mensaje}"></div>

    <p sec:authorize="isAuthenticated()">
        <a class="btn" th:href="@{/estudiantes/nuevo}">+ Nuevo estudiante</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Email</th>
            <th>Cursos inscritos</th>
            <th>Fecha de registro</th>
            <th sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="estudiante : ${estudiantes}">
            <td th:text="${estudiante.nombre}"></td>
            <td th:text="${estudiante.apellido}"></td>
            <td th:text="${estudiante.email}"></td>
            <td>
                <span th:each="curso, iter : ${estudiante.cursos}">
                    <span th:text="${curso.nombre}"></span><span th:if="!${iter.last}">, </span>
                </span>
            </td>
            <td th:text="${estudiante.fechaRegistro}"></td>
            <td class="actions" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/estudiantes/editar/{id}(id=${estudiante.id})}">Editar</a>
                <a th:href="@{/estudiantes/eliminar/{id}(id=${estudiante.id})}"
                   onclick="return confirm('¿Eliminar este estudiante?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(estudiantes)}">
            <td colspan="6">No hay estudiantes registrados todavia.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
