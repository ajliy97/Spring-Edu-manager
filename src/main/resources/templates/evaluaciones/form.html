<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar evaluacion - SpringEduManager</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container">
    <h1>Registrar evaluacion</h1>

    <div class="card">
        <form th:action="@{/evaluaciones/guardar}" th:object="${evaluacion}" method="post">

            <div class="form-group">
                <label for="estudiante">Estudiante</label>
                <select id="estudiante" th:field="*{estudiante}">
                    <option th:each="est : ${estudiantes}"
                            th:value="${est.id}"
                            th:text="${est.nombre} + ' ' + ${est.apellido}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="curso">Curso</label>
                <select id="curso" th:field="*{curso}">
                    <option th:each="curso : ${cursos}"
                            th:value="${curso.id}"
                            th:text="${curso.nombre}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="nota">Nota (0 a 10)</label>
                <input type="number" id="nota" step="0.1" min="0" max="10" th:field="*{nota}">
                <p class="error" th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}"></p>
            </div>

            <div class="form-group">
                <label for="comentario">Comentario</label>
                <textarea id="comentario" rows="3" th:field="*{comentario}"></textarea>
            </div>

            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/evaluaciones}" class="btn" style="background:#888;">Cancelar</a>
        </form>
    </div>
</div>

</body>
</html>
