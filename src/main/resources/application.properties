# ==========================================================
# SpringEduManager - configuracion de la aplicacion
# ==========================================================

spring.application.name=springedumanager
server.port=8080

# ----------------------------------------------------------
# Base de datos embebida H2 (Leccion 3)
# Para usar MySQL en su lugar, comenta el bloque H2 y
# descomenta el bloque MySQL de mas abajo.
# ----------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:springedumanager;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------
# Alternativa: MySQL (descomentar y ajustar credenciales)
# ----------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/springedumanager?createDatabaseIfNotExist=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ----------------------------------------------------------
# Thymeleaf
# ----------------------------------------------------------
spring.thymeleaf.cache=false

# ----------------------------------------------------------
# Usuarios de la aplicacion (Leccion 4)
# Definidos de forma tipada en SecurityConfig para poder
# aplicarles BCryptPasswordEncoder; se documentan aqui como
# referencia rapida de credenciales de prueba:
#   admin / admin123  -> ROLE_ADMIN, ROLE_USER
#   user  / user123   -> ROLE_USER
# ----------------------------------------------------------
